<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coretax Automation</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Coretax Automation</h1>
      </div>
      <div class="status" id="status">
        <span class="status-dot idle"></span>
        <span class="status-text">Idle</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Start Button -->
      <button id="startBtn" class="btn btn-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 3L19 12L5 21V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download Prepaid Bukpot
      </button>

      <!-- Progress Section -->
      <div id="progressSection" class="progress-section hidden">
        <div class="progress-info">
          <div class="progress-label">
            <span>Progress</span>
            <span id="progressText">0 / 0</span>
          </div>
          <div class="progress-bar">
            <div id="progressBar" class="progress-fill"></div>
          </div>
        </div>
        <div class="current-action">
          <span id="currentAction">Menunggu...</span>
        </div>
      </div>

      <!-- Stats Section -->
      <div id="statsSection" class="stats-section hidden">
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Berhasil</div>
            <div class="stat-value success" id="downloadCount">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Gagal</div>
            <div class="stat-value error" id="failCount">0</div>
          </div>
        </div>
      </div>

      <!-- Control Buttons -->
      <div id="controlSection" class="control-section">
        <button id="stopBtn" class="btn btn-secondary hidden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Stop
        </button>
        <button id="resetBtn" class="btn btn-secondary hidden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12H21M3 12L9 6M3 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Reset
        </button>
      </div>

      <!-- Log Section -->
      <div class="log-section">
        <div class="log-header">
          <span>Activity Log</span>
          <button id="clearLogBtn" class="btn-small">Clear</button>
        </div>
        <div id="logContainer" class="log-container">
          <div class="log-item log-info">
            <span class="log-icon">ℹ</span>
            <span class="log-time">--:--:--</span>
            <span class="log-message">Extension siap digunakan</span>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="settings-section">
        <div class="setting-item">
          <label for="delayRange">
            Delay (ms): <span id="delayValue">500</span>
          </label>
          <input type="range" id="delayRange" min="100" max="2000" value="500" step="100">
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="autoScroll" checked>
            Auto Scroll
          </label>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-content">
        <span class="footer-version">Coretax Automation v1.0</span>
        <span class="footer-credits">Idea by Wahyu Budi Lestari. Powered By AFS</span>
      </div>
      <a href="#" id="helpLink">Bantuan</a>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
